name: 'Configure Bright credentials'
description: 'Retrieves an OIDC token, exchanges it for a BrightSec token, and sets BRIGHT_TOKEN.'
inputs:
  BRIGHT_HOSTNAME:
    description: 'BrightSec hostname'
    required: true
  BRIGHT_PROJECT_ID:
    description: 'BrightSec project ID'
    required: true
  BRIGHT_TOKEN:
    description: 'BrightSec API token (fallback, not used with OIDC)'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Retrieve OIDC token
      id: oidc
      shell: bash
      run: |
        echo "token=$(curl -s -H \"Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN\" \"$ACTIONS_ID_TOKEN_REQUEST_URL&audience=brightsec.com\" | jq -r .value)" >> $GITHUB_OUTPUT
    - name: Exchange OIDC token for BrightSec token
      id: bright
      shell: bash
      env:
        OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        BRIGHT_HOSTNAME: ${{ inputs.BRIGHT_HOSTNAME }}
        BRIGHT_PROJECT_ID: ${{ inputs.BRIGHT_PROJECT_ID }}
      run: |
        BRIGHT_RESPONSE=$(curl -s -X POST "https://${BRIGHT_HOSTNAME}/api/latest/auth/oidc/token" \
          -H "Content-Type: application/json" \
          -d '{"oidcToken":"'"$OIDC_TOKEN"'","projectId":"'"$BRIGHT_PROJECT_ID"'"}')
        PURE_KEY=$(echo "$BRIGHT_RESPONSE" | jq -r .pureKey)
        echo "::add-mask::$PURE_KEY"
        echo "BRIGHT_TOKEN=$PURE_KEY" >> $GITHUB_ENV
